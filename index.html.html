<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d1312">
    <title>FitAI Pro — Twój Dobry Rytm</title>
    <style>
        :root {
            --bg-main: #0d1312;
            --bg-sidebar: #111917;
            --bg-card: #16201d;
            --bg-input: #0d1312;
            --border: #23332e;
            --accent: #22c55e;
            --accent-dark: #16a34a;
            --accent-soft: rgba(34, 197, 94, 0.14);
            --text-main: #f1f5f9;
            --text-muted: #8b9d97;
            --gold: #fbbf24;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background-color: var(--bg-main); color: var(--text-main); display: flex; min-height: 100vh; }

        /* UKŁAD GŁÓWNY (LAPTOP + TELEFON) */
        .layout { display: flex; width: 100%; min-height: 100vh; }

        /* PANEL BOCZNY (STYL ZE ZDJĘCIA) */
        .sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 20px; }
        .brand-logo {
            width: 34px; height: 34px; background: var(--accent); color: #052e16;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 20px;
        }
        .brand-name { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .pro-badge {
            font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px;
            border: 1px solid var(--accent); color: var(--accent); margin-left: 4px;
        }
        .menu-label { font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: 1px; padding: 0 12px 8px; }
        .nav-btn {
            width: 100%; background: transparent; border: none; color: var(--text-muted);
            padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 600;
            display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left;
            margin-bottom: 4px; transition: 0.15s;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.04); color: var(--text-main); }
        .nav-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }

        .sidebar-footer { padding: 14px 12px; border-top: 1px solid var(--border); }
        .motto { font-size: 16px; font-weight: 800; line-height: 1.3; margin-bottom: 6px; }
        .status-dot { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

        /* TREŚĆ GŁÓWNA */
        .main { flex: 1; padding: 22px 26px 90px; max-width: 960px; margin: 0 auto; width: 100%; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .breadcrumb { font-size: 12px; color: var(--text-muted); }
        .avatar {
            width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft);
            border: 1px solid var(--accent); color: var(--accent); font-weight: 800;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
        }

        .hero-tag { font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
        .hero-title { font-size: 28px; font-weight: 800; margin: 4px 0 6px; }
        .hero-sub { font-size: 13.5px; color: var(--text-muted); margin: 0 0 22px; }

        /* KARTY */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .card {
            background-color: var(--bg-card); border: 1px solid var(--border);
            border-radius: 18px; padding: 20px;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .card-title { font-size: 15px; font-weight: 700; margin: 0; }
        .pill {
            font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 20px;
            background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(34,197,94,0.3);
        }

        /* KÓŁKO BILANSU */
        .energy-wrap { display: flex; align-items: center; justify-content: space-around; gap: 16px; }
        .ring {
            width: 135px; height: 135px; border-radius: 50%;
            background: radial-gradient(var(--bg-card) 64%, transparent 65%), conic-gradient(var(--accent) 0%, #243530 0%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .ring-lbl { font-size: 11px; color: var(--text-muted); }
        .ring-val { font-size: 28px; font-weight: 800; line-height: 1.1; }
        .ring-unit { font-size: 11px; color: var(--text-muted); }

        .energy-list { display: flex; flex-direction: column; gap: 10px; }
        .e-item-lbl { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .e-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
        .e-item-val { font-size: 16px; font-weight: 800; padding-left: 12px; }

        /* MAKROSKŁADNIKI */
        .macro-row { margin-bottom: 14px; }
        .macro-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .bar-bg { width: 100%; height: 6px; background: #243530; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; border-radius: 4px; transition: width 0.3s; }
        .fill-b { background: #f43f5e; }
        .fill-w { background: #38bdf8; }
        .fill-t { background: #fbbf24; }

        /* POSIŁKI */
        .meal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .meal-btn {
            background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main);
            padding: 12px; border-radius: 12px; text-align: left; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
        }
        .meal-btn:hover { border-color: var(--accent); }
        .plus-icon {
            width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft);
            color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800;
        }

        /* FORMULARZ PROFILU */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        .field label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .field input, .field select {
            background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main);
            padding: 11px 12px; border-radius: 10px; font-size: 14px; outline: none;
        }
        .field input:focus, .field select:focus { border-color: var(--accent); }

        .btn-primary {
            background: var(--accent); color: #052e16; border: none; padding: 13px 20px;
            border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; width: 100%;
        }
        .btn-primary:hover { background: var(--accent-dark); color: white; }

        /* CZAT AI */
        .chat-box {
            height: 320px; overflow-y: auto; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px;
        }
        .msg { padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.45; max-width: 82%; }
        .msg.ai { background: #1c2925; border: 1px solid var(--border); align-self: flex-start; }
        .msg.me { background: var(--accent); color: #052e16; font-weight: 600; align-self: flex-end; }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .chip {
            background: var(--bg-input); border: 1px solid var(--border); color: var(--accent);
            padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; font-weight: 600;
        }
        .chat-bar { display: flex; gap: 8px; }
        .chat-bar input {
            flex: 1; background: var(--bg-input); border: 1px solid var(--border); color: white;
            padding: 12px; border-radius: 12px; outline: none; font-size: 14px;
        }

        /* DOLNA NAWIGACJA NA TELEFON */
        .mobile-nav {
            display: none; position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--bg-sidebar); border-top: 1px solid var(--border);
            padding: 8px 4px; z-index: 100; justify-content: space-around;
        }
        .m-btn {
            background: none; border: none; color: var(--text-muted); font-size: 10px;
            font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
        }
        .m-btn.active { color: var(--accent); }
        .m-btn span { font-size: 18px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .mobile-nav { display: flex; }
            .grid-2, .meal-grid, .form-grid { grid-template-columns: 1fr; }
            .main { padding: 16px 16px 85px; }
        }
    </style>
</head>
<body>

<div class="layout">
